name: AutoKam
options:
  bundleIdPrefix: com.lightwave
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  AutoKam:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: AutoKam
    settings:
      base:
        PRODUCT_NAME: AutoKam
        PRODUCT_BUNDLE_IDENTIFIER: com.lightwave.autokam
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info-iOS.plist
        "INFOPLIST_FILE[sdk=macosx*]": Config/Info-macOS.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/AutoKam-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  AutoKam:
    build:
      targets:
        AutoKam: all
    archive:
      config: Release
